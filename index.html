<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Panel - Login & Signup</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 25px; border-radius: 12px; width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #38bdf8; border: none; color: #0f172a; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0ea5e9; }
        .hidden { display: none; }
        .toggle-btn { background: none; border: none; color: #38bdf8; cursor: pointer; text-align: center; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container" id="auth-container">
        <!-- साइन अप फॉर्म -->
        <div id="signup-box">
            <h2>खाता बनाएँ (Sign Up)</h2>
            <input type="text" id="signup-username" placeholder="यूज़रनेम दर्ज करें">
            <input type="email" id="signup-email" placeholder="ईमेल दर्ज करें">
            <input type="password" id="signup-password" placeholder="पासवर्ड दर्ज करें">
            <button onclick="handleSignUp()">रजिस्टर करें</button>
            <button class="toggle-btn" onclick="toggleForm('login')">पहले से खाता है? लॉगिन करें</button>
        </div>

        <!-- लॉगिन फॉर्म -->
        <div id="login-box" class="hidden">
            <h2>लॉगिन करें (Login)</h2>
            <input type="email" id="login-email" placeholder="ईमेल दर्ज करें">
            <input type="password" id="login-password" placeholder="पासवर्ड दर्ज करें">
            <button onclick="handleLogin()">लॉगिन करें</button>
            <button class="toggle-btn" onclick="toggleForm('signup')">नया खाता बनाएँ</button>
        </div>
    </div>

    <!-- डैशबोर्ड (लॉगिन के बाद दिखने वाला हिस्सा) -->
    <div class="container hidden" id="dashboard-container">
        <h2>स्वागत है! 🎉</h2>
        <p>यूज़रनेम: <span id="user-display"></span></p>
        <p>फॉलोअर्स काउंट: <span id="followers-display">0</span></p>
        <button onclick="increaseFollowers()">फ्री फॉलोअर्स बढ़ाएं (+10)</button>
        <button style="background: #ef4444; color: #fff; margin-top: 20px;" onclick="handleLogout()">लॉगआउट</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // आपकी Firebase कॉन्फ़िगरेशन
        const firebaseConfig = {
          apiKey: "AIzaSyAA5-wzmHpGLtTkDgCNJ6ZH-Gn...",
          authDomain: "smm-pannel-9f14f.firebaseapp.com",
          projectId: "smm-pannel-9f14f",
          storageBucket: "smm-pannel-9f14f.appspot.com",
          messagingSenderId: "218974351889",
          appId: "1:218974351889:web:30c410a2171b9...",
          measurementId: "G-LC19PSLG2M"
        };

        // Firebase इनिशियलाइज करें
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;

        // फॉर्म स्विच करने का फंक्शन
        window.toggleForm = function(type) {
            if(type === 'login') {
                document.getElementById('signup-box').classList.add('hidden');
                document.getElementById('login-box').classList.remove('hidden');
            } else {
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('signup-box').classList.remove('hidden');
            }
        }

        // साइन-अप फंक्शन
        window.handleSignUp = async function() {
            const username = document.getElementById('signup-username').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Firestore में यूज़र का डेटा सेव करें
                await setDoc(doc(db, "users", user.uid), {
                    username: username,
                    email: email,
                    followersCount: 0,
                    createdAt: new Date()
                });
                
                alert("अकाउंट सफलतापूर्वक बन गया!");
            } catch (error) {
                alert("एरर: " + error.message);
            }
        }

        // लॉगिन फंक्शन
        window.handleLogin = async function() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("लॉगिन सफल रहा!");
            } catch (error) {
                alert("लॉगिन फेल: " + error.message);
            }
        }

        // लॉगआउट फंक्शन
        window.handleLogout = async function() {
            await signOut(auth);
            alert("लॉगआउट हो गए!");
        }

        // फॉलोअर्स बढ़ाने का फंक्शन
        window.increaseFollowers = async function() {
            if (!currentUserUid) return;
            try {
                const userRef = doc(db, "users", currentUserUid);
                await updateDoc(userRef, {
                    followersCount: increment(10)
                });
                alert("10 फॉलोअर्स सफलतापूर्वक जोड़ दिए गए हैं!");
                loadUserData(currentUserUid);
            } catch (error) {
                alert("फॉलोअर्स अपडेट करने में एरर: " + error.message);
            }
        }

        // यूज़र डेटा लोड करने का फंक्शन
        async function loadUserData(uid) {
            const userDoc = await getDoc(doc(db, "users", uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                document.getElementById('user-display').innerText = data.username || "User";
                document.getElementById('followers-display').innerText = data.followersCount || 0;
            }
        }

        // ऑथेंटिकेशन स्टेट ट्रैक करना
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserUid = user.uid;
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard-container').classList.remove('hidden');
                loadUserData(user.uid);
            } else {
                currentUserUid = null;
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('dashboard-container').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
